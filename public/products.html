<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - VAA THÉ</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/products.css">
</head>
<body>

    <!-- Các component sẽ được load vào đây thông qua JavaScript (fetch) -->
    <div id="header-container"></div>
    <div id="navbar-container"></div>
    <div id="content-container"></div>
    <div id="footer-container"></div>

    <!-- Script load components -->
    <script>
        async function loadComponents() {
            try {
                // Tải Navbar
                const navRes = await fetch('../app/views/partials/navbar.html');
                document.getElementById('navbar-container').innerHTML = await navRes.text();

                // Đánh dấu menu Sản phẩm là "active"
                setTimeout(() => {
                    const navLinks = document.querySelectorAll('.nav-link');
                    navLinks.forEach(link => {
                        if (link.textContent.trim() === 'Sản phẩm') {
                            link.classList.add('active');
                            link.href = '#';
                        }
                    });
                }, 100);

                // Tải Nội dung trang Sản phẩm
                const productsRes = await fetch('../app/views/customer/products/index.html');
                document.getElementById('content-container').innerHTML = await productsRes.text();

                // Tải Footer
                const footerRes = await fetch('../app/views/layouts/footer.html');
                const footerText = await footerRes.text();
                document.getElementById('footer-container').innerHTML = footerText;

                // Cập nhật link liên hệ trong Footer
                setTimeout(() => {
                    const footerLinks = document.querySelectorAll('#footer-container a');
                    footerLinks.forEach(link => {
                        if (link.textContent.trim() === 'Trang chủ') {
                            link.href = 'index.html';
                        }
                    });
                }, 100);

                // Load main.js sau khi các DOM element đã được load xong
                const script = document.createElement('script');
                script.src = 'assets/js/main.js';
                document.body.appendChild(script);

            } catch (error) {
                console.error('Lỗi khi tải component:', error);
                document.getElementById('content-container').innerHTML = '<p class="text-center mt-5 text-danger">Vui lòng chạy project qua Localhost (XAMPP) để tính năng chia nhỏ file HTML hoạt động.</p>';
            }
        }

        loadComponents();
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
